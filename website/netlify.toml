# Reel website: Netlify publishes this folder as it is (no build step).
# Author: Alexius Academia
# Date: 2026-10-27
[build]
  publish = "."
  command = ""
  # Build on every push to main.
  ignore = "exit 1"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
